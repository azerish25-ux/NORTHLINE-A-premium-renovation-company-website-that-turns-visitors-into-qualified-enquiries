name: WordPress quality and release packages
on:
  push:
    paths-ignore: ['theme/northline/assets/images/**', 'creative/models/**']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: northline-quality
  cancel-in-progress: true
jobs:
  wordpress:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: northline-ci-only
          MYSQL_DATABASE: northline
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pnorthline-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, gd, fileinfo, exif
          tools: wp-cli
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, tokens and domain contracts
        run: |
          mkdir -p evidence
          find plugins theme tests tools -name '*.php' -print0 | xargs -0 -n1 php -l
          find plugins theme -name '*.js' -print0 | xargs -0 -n1 node --check
          python tools/build-design.py
          git diff --exit-code -- theme/northline/assets/tokens.css
          php tests/domain.php 2>&1 | tee evidence/domain.txt
          php tests/design.php 2>&1 | tee evidence/design-markup.txt
      - name: Install and test isolated WordPress
        env:
          NORTHLINE_TESTING: '1'
        run: |
          mkdir -p /tmp/northline-wp
          wp core download --path=/tmp/northline-wp --version=latest
          wp config create --path=/tmp/northline-wp --dbname=northline --dbuser=root --dbpass=northline-ci-only --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path=/tmp/northline-wp --url=http://127.0.0.1:8090 --title=NORTHLINE --admin_user=studio --admin_password=Northline-CI-Only-Password --admin_email=studio@example.com --skip-email
          cp -R theme/northline /tmp/northline-wp/wp-content/themes/
          cp -R plugins/northline-planner /tmp/northline-wp/wp-content/plugins/
          wp plugin activate northline-planner --path=/tmp/northline-wp
          wp theme activate northline --path=/tmp/northline-wp
          wp option update timezone_string America/Halifax --path=/tmp/northline-wp
          wp rewrite structure '/%postname%/' --path=/tmp/northline-wp
          wp northline seed --path=/tmp/northline-wp
          wp eval-file "$PWD/tests/integration.php" --path=/tmp/northline-wp 2>&1 | tee evidence/wordpress-integration.txt
          wp northline design-draft --path=/tmp/northline-wp
          wp core version --path=/tmp/northline-wp > evidence/wordpress-version.txt
      - name: Build preview and installable packages
        run: |
          php tools/build-preview.php
          python tools/package.py
      - name: Install pinned browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify design and complete mobile-to-staff workflows
        env:
          NORTHLINE_TESTING: '1'
          NORTHLINE_WORDPRESS: '1'
        run: |
          # No external mail transport is exercised by browser fixtures.
          mkdir -p /tmp/northline-wp/wp-content/mu-plugins
          printf '%s\n' '<?php add_filter("pre_wp_mail", "__return_false");' > /tmp/northline-wp/wp-content/mu-plugins/disable-test-mail.php
          php -S 127.0.0.1:8090 -t /tmp/northline-wp tools/test-router.php > evidence/wordpress-server.log 2>&1 &
          python -m http.server 8091 --bind 127.0.0.1 --directory preview > evidence/preview-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8090/ > /dev/null && curl --fail --silent http://127.0.0.1:8091/ > /dev/null && break; sleep 1; done
          node tests/design.cjs 2>&1 | tee evidence/design-browser.txt
          node tests/browser.cjs 2>&1 | tee evidence/browser.txt
          python - <<'PYVERIFY'
          import json
          from pathlib import Path
          for name in ['design-results.json', 'browser-results.json']:
              result=json.loads(Path('evidence', name).read_text())
              assert result['status']=='passed' and result['assertions']>0
          PYVERIFY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: northline-verified-build
          path: |
            plugins/
            theme/
            tools/
            tests/
            docs/
            creative/
            preview/
            dist/
            evidence/
            README.md
          retention-days: 14
