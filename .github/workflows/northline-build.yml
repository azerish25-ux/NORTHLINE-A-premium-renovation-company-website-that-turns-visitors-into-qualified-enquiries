name: Architectural image studio
on:
  push:
    paths: ['tools/render_architecture.py', '.github/workflows/northline-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: northline-architecture
  cancel-in-progress: false
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        project: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update -qq && sudo apt-get install -y blender
      - name: Render matched camera pairs
        run: blender -b -t 4 -P tools/render_architecture.py -- --project ${{ matrix.project }} --samples 96 --output rendered
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-${{ matrix.project }}
          path: rendered/
          retention-days: 7
  publish:
    needs: render
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: architecture-*
          path: theme/northline/assets/images
          merge-multiple: true
      - name: Publish original paired visualisations
        run: |
          git config user.name 'NORTHLINE studio'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add theme/northline/assets/images
          if ! git diff --cached --quiet; then
            git commit -m 'art: publish six original matched architectural visualisation pairs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: northline-original-architecture
          path: theme/northline/assets/images
          retention-days: 14
